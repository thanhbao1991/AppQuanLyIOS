name: Build unsigned iOS IPA

# Build chạy trên macOS runner của GitHub (không cần Mac thật) — output là .ipa CHƯA KÝ.
# Ký + cài thật làm ở máy Windows bằng Sideloadly (dùng Apple ID cá nhân), KHÔNG ký trong CI
# để khỏi phải nhét Apple ID/2FA vào secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Ký thật + đẩy lên TestFlight (mặc định false = bản unsigned sideload cũ)"
        type: boolean
        default: false

jobs:
  test:
    # Job riêng, chạy trên simulator (không -sdk iphoneos như job build) — build cho thiết bị thật
    # không code-sign được thì cũng không chạy test được (XCTest cần app thật thực thi, không chỉ
    # build). Test target thêm 2026-09-06, xem Tests/ — trước đó app này không có test nào.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (iOS Simulator)
        # Không chỉ đích danh model ("iPhone 16") — GitHub âm thầm đổi simulator mặc định trên
        # image macos-15 theo thời gian (2026-09-08 từng gãy CI vì "iPhone 16" biến mất khỏi
        # runner). Tự dò 1 simulator iPhone có sẵn (bất kỳ) trên máy thay vì hardcode tên.
        run: |
          set -e
          UDID=$(xcrun simctl list devices available \
            | grep -m1 -E 'iPhone [0-9]+ \(' \
            | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "Khong tim thay simulator iPhone nao kha dung"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Dung simulator: $UDID"
          xcodebuild test \
            -project AppMobileIOS.xcodeproj \
            -scheme AppMobileIOS \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

  build:
    # macos-14 chỉ có Xcode 15.4 sẵn — xcodegen bản mới ghi project file format 77 (Xcode 16+),
    # Xcode 15.4 không mở được ("future Xcode project file format"). macos-15 có Xcode 16 mặc định.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # CFBundleShortVersionString/CFBundleVersion trong project.yml cố định "1.0"/"1" (không đổi
      # bao giờ) — stamp gitSha+build time vào đây để app hiện được đang chạy bản build nào (xem
      # trong Menu > cạnh tên tài khoản), tránh nhầm "chưa cài bản mới" như Backend đã làm với
      # /health/ui. Info.plist do xcodegen SINH RA ở bước trên (info.path trong project.yml), nên
      # phải patch SAU generate, TRƯỚC build.
      - name: Stamp build version into Info.plist
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          BUILD_TIME=$(date -u +%Y%m%d%H%M%S)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${SHORT_SHA}" Sources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_TIME}" Sources/Info.plist

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project AppMobileIOS.xcodeproj \
            -scheme AppMobileIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/AppMobileIOS.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AppMobileIOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AppMobileIOS-unsigned-ipa
          path: AppMobileIOS-unsigned.ipa

  # Ký thật + đẩy lên TestFlight — CHỈ chạy khi bấm workflow_dispatch với release=true. Không chạy
  # trên push thường (tránh tốn build slot App Store Connect + cần secrets ký chỉ nên dùng khi
  # cố ý nộp bản test/release). Cần 9 secrets tạo tay trên Apple Developer Portal/App Store Connect
  # rồi add vào GitHub repo Settings > Secrets: IOS_DIST_CERTIFICATE_BASE64 (base64 của file .p12
  # Distribution cert), IOS_DIST_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64 (base64 của
  # .mobileprovision loại App Store), IOS_PROVISIONING_PROFILE_NAME (đúng tên profile hiện trên
  # Developer Portal), IOS_KEYCHAIN_PASSWORD (tự đặt, chỉ dùng tạm trong CI run), APPLE_TEAM_ID,
  # ASC_API_KEY_ID + ASC_API_ISSUER_ID + ASC_API_KEY_BASE64 (base64 file .p8 tạo ở App Store Connect
  # > Users and Access > Integrations > App Store Connect API, role tối thiểu "App Manager"). Mẫu
  # copy từ AppDatHangIOS — xem memory project_appdathangios_testflight_ci.
  testflight:
    if: ${{ inputs.release }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Build number = so lan chay workflow (luon tang, khop yeu cau App Store Connect). Version
      # dang so (1.0) giu nguyen tu project.yml, KHONG dam gitSha vao day (App Store Connect tu choi
      # version chua chu).
      - name: Stamp build number into Info.plist
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          /usr/libexec/PlistBuddy -c "Add :DennGitSha string ${SHORT_SHA}" Sources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Sources/Info.plist

      # Theo huong dan chinh thuc cua GitHub cho macOS runner:
      # https://docs.github.com/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Import signing certificate + provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/profile.mobileprovision

      - name: Archive (signed, App Store distribution)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          xcodebuild archive \
            -project AppMobileIOS.xcodeproj \
            -scheme AppMobileIOS \
            -configuration Release \
            -archivePath build/AppMobileIOS.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export .ipa (App Store method)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.denncoffee.appquanly</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/AppMobileIOS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA_PATH=$(find build/export -maxdepth 1 -iname "*.ipa" | head -1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
