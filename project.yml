name: AppMobileIOS
packages:
  libvpx:
    url: https://github.com/ronnyf/libvpx.git
    branch: release/webrtc
options:
  bundleIdPrefix: uk.denncoffee
  deploymentTarget:
    iOS: "16.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  AppMobileIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: libvpx
        product: libvpx
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ĐENN
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSContactsUsageDescription: Đồng bộ tên khách hàng vào Danh bạ để hiện tên khi khách gọi đến.
        NSCameraUsageDescription: Chụp ảnh hoá đơn mua hàng để đọc tự động vào Chi tiêu.
        NSPhotoLibraryUsageDescription: Chọn ảnh từ album Yêu thích để cập nhật ảnh món trong menu.
        CFBundleURLTypes:
          - CFBundleURLName: uk.denncoffee.appmobileios
            CFBundleURLSchemes:
              - trasuaapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.denncoffee.appmobileios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    scheme:
      testTargets:
        - AppMobileIOSTests
  AppMobileIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AppMobileIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.denncoffee.appmobileios.tests
        SWIFT_VERSION: "5.0"
