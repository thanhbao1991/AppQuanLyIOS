name: AppMobileIOS
packages:
  libvpx:
    url: https://github.com/ronnyf/libvpx.git
    branch: release/webrtc
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 155.0.0
  # Bản đồ khách hàng offline (12/11/2026): nền OpenStreetMap tự dựng, tên đường quán tự gắn — BanDoOfflineView.swift.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.5.0"
options:
  bundleIdPrefix: uk.denncoffee
  deploymentTarget:
    iOS: "16.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  AppMobileIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: libvpx
        product: libvpx
      - package: WebRTC
        product: WebRTC
      - package: MapLibre
        product: MapLibre
      # Ghép giọng đọc push có số tiền (13/11/2026) — xem ThongBaoExt/NotificationService.swift.
      - target: ThongBaoExt
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ĐENN
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Bản đồ khách hàng — đứng tại nhà khách để gán số nhà và xác nhận tên khúc đường đang đứng.
        NSContactsUsageDescription: Đồng bộ tên khách hàng vào Danh bạ để hiện tên khi khách gọi đến.
        NSCameraUsageDescription: Chụp ảnh hoá đơn mua hàng để đọc tự động vào Chi tiêu, và chụp ảnh món cho menu.
        NSMicrophoneUsageDescription: Bộ đàm quầy — giữ nút hoặc nghe cuộc gọi để nói chuyện với máy quầy.
        NSPhotoLibraryUsageDescription: Chọn ảnh từ album Yêu thích để cập nhật ảnh món trong menu.
        CFBundleURLTypes:
          - CFBundleURLName: com.denncoffee.appquanly
            CFBundleURLSchemes:
              - trasuaapp
        UIBackgroundModes:
          - remote-notification
          - voip
          - audio
        # Icon dịp lễ (2026-11-08, cùng bộ icon app khách): icon chính là icon app quản lý, đổi sang icon phụ
        # AppIcon-<MA> sau màn chào dịp lễ (xem DipLe.swift). Thêm dịp: chép appiconset + khai ở đây + DipLeIcon.maCoIcon.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIcon-NOEL:
              CFBundleIconName: AppIcon-NOEL
            AppIcon-VALENTINE:
              CFBundleIconName: AppIcon-VALENTINE
            AppIcon-TETAL:
              CFBundleIconName: AppIcon-TETAL
            AppIcon-TETDUONG:
              CFBundleIconName: AppIcon-TETDUONG
            AppIcon-QTPHUNU:
              CFBundleIconName: AppIcon-QTPHUNU
            AppIcon-PHUNUVN:
              CFBundleIconName: AppIcon-PHUNUVN
            AppIcon-GIOTO:
              CFBundleIconName: AppIcon-GIOTO
            AppIcon-GIAIPHONG:
              CFBundleIconName: AppIcon-GIAIPHONG
            AppIcon-THIEUNHI:
              CFBundleIconName: AppIcon-THIEUNHI
            AppIcon-DOANNGO:
              CFBundleIconName: AppIcon-DOANNGO
            AppIcon-THUONGBINH:
              CFBundleIconName: AppIcon-THUONGBINH
            AppIcon-VULAN:
              CFBundleIconName: AppIcon-VULAN
            AppIcon-QUOCKHANH:
              CFBundleIconName: AppIcon-QUOCKHANH
            AppIcon-TRUNGTHU:
              CFBundleIconName: AppIcon-TRUNGTHU
            AppIcon-NHAGIAO:
              CFBundleIconName: AppIcon-NHAGIAO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denncoffee.appquanly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bắt buộc để đóng gói cả các AppIcon-*.appiconset phụ — thiếu thì setAlternateIconName thất bại âm thầm.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: AppMobileIOS.entitlements
        # CI truyền APP_PROFILE/EXT_PROFILE khi ký thật (mỗi target 1 hồ sơ) — bản unsigned để trống.
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)
    scheme:
      testTargets:
        - AppMobileIOSTests
  # Notification Service Extension: nối các mảnh âm (tên khách, thao tác, chữ số) backend gửi trong push thành
  # 1 file đọc "Tên, Thao tác, Số tiền". Dùng chung App Group group.com.denncoffee.appquanly với app chính.
  ThongBaoExt:
    type: app-extension
    platform: iOS
    sources:
      - path: ThongBaoExt
    info:
      path: ThongBaoExt/Info.plist
      properties:
        CFBundleDisplayName: ThongBaoExt
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denncoffee.appquanly.thongbao
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: ThongBaoExt/ThongBaoExt.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(EXT_PROFILE)
  AppMobileIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AppMobileIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denncoffee.appquanly.tests
        SWIFT_VERSION: "5.0"
